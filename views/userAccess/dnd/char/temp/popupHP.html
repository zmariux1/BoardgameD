<div class="hp-modal" role="dialog" aria-modal="true" aria-labelledby="hp-title">
  <div class="hp-modal__frame">

    <header class="hp-modal__header">
      <div class="hp-modal__heading">
        <span class="hp-modal__heart" aria-hidden="true">♥</span>
        <h2 id="hp-title">Hit Points</h2>
      </div>
      <button class="hp-modal__close" type="button" aria-label="Close">×</button>
    </header>

    <!-- CURRENT HP -->
    <section class="hp-panel hp-panel--current">
      <div class="hp-current">
        <span class="hp-eyebrow">CURRENT HP</span>
        <div class="hp-current__value">
          <strong>45</strong><span>/</span><span>45</span>
        </div>
      </div>

      <div class="hp-bar" role="progressbar"
        aria-label="Hit points" aria-valuenow="45"
        aria-valuemin="0" aria-valuemax="45">
        <div class="hp-bar__fill"></div>
      </div>

      <div class="hp-actions">
        <label class="hp-number">
          <span class="hp-sr-only">Amount</span>
          <input type="number" value="45" min="0" />
        </label>
        <button class="hp-button hp-button--heal" type="button">
          <span aria-hidden="true">＋</span> Heal
        </button>
        <button class="hp-button hp-button--damage" type="button">
          <span aria-hidden="true">−</span> Damage
        </button>
      </div>
    </section>

    <!-- DEATH SAVING THROWS -->
    <section class="hp-panel hp-panel--death" aria-labelledby="death-title">
      <h3 class="hp-section-title" id="death-title">
        <span aria-hidden="true">☠</span> Death Saving Throws
      </h3>

      <div class="hp-save-row">
        <span class="hp-save-label">Failures</span>
        <div class="hp-save-icons" aria-label="2 of 3 failures">
          <span class="hp-skull is-active" aria-hidden="true">☠</span>
          <span class="hp-skull is-active" aria-hidden="true">☠</span>
          <span class="hp-skull is-inactive" aria-hidden="true">☠</span>
        </div>
      </div>

      <div class="hp-save-row hp-save-row--success">
        <span class="hp-save-label">Successes</span>
        <div class="hp-save-icons" aria-label="1 of 3 successes">
          <span class="hp-success is-active" aria-hidden="true">✦</span>
          <span class="hp-success is-inactive" aria-hidden="true">✦</span>
          <span class="hp-success is-inactive" aria-hidden="true">✦</span>
        </div>
      </div>

      <button class="hp-button hp-button--roll" type="button">
        <span aria-hidden="true">✥</span>
        Roll Saving Throws
      </button>
    </section>

    <!-- HP SETTINGS -->
    <section class="hp-panel hp-panel--settings" aria-label="HP settings">
      <label class="hp-field">
        <span class="hp-field__icon" aria-hidden="true">♥</span>
        <span class="hp-field__label">Max HP</span>
        <input type="number" value="45" min="1" />
      </label>

      <label class="hp-field">
        <span class="hp-field__icon" aria-hidden="true">♥</span>
        <span class="hp-field__label">Current HP</span>
        <input type="number" value="45" min="0" />
      </label>

      <label class="hp-field">
        <span class="hp-field__icon" aria-hidden="true">✥</span>
        <span class="hp-field__label">Modifier</span>
        <input type="number" value="0" />
      </label>

      <label class="hp-overwrite">
        <span class="hp-overwrite__check">
          <input type="checkbox" />
          <span>Overwrite</span>
        </span>
        <span class="hp-overwrite__description">
          Replace current HP with the value above.
        </span>
      </label>
    </section>

  </div>
</div>
